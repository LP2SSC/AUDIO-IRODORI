<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>IRODORI 123 LP2SSC</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a2332;
      --border: #2d3a4f;
      --text: #e7ecf3;
      --muted: #8b9bb4;
      --starter: #f59e0b;
      --elem1: #8b5cf6;
      --elem2: #ec4899;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      padding: 10px 12px 8px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      z-index: 10;
    }
    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    h1 { font-size: 1.1rem; }
    .btn-settings {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-settings.edit {
      background: #1e3a2f;
      border-color: #2d6a4f;
      color: #6ee7b7;
    }
    .subtitle { color: var(--muted); font-size: 0.72rem; margin-bottom: 8px; }
    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    .tab {
      flex: 1;
      padding: 8px 4px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.82rem;
      cursor: pointer;
      background: var(--card);
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .tab.active { color: #fff; }
    .tab.starter.active { background: var(--starter); border-color: var(--starter); }
    .tab.elem1.active { background: var(--elem1); border-color: var(--elem1); }
    .tab.elem2.active { background: var(--elem2); border-color: var(--elem2); }

    .lessons-wrap {
      display: flex;
      gap: 5px;
      overflow-x: auto;
      padding-bottom: 4px;
      -webkit-overflow-scrolling: touch;
    }
    .lessons-wrap::-webkit-scrollbar { height: 0; }
    .lesson-btn {
      flex-shrink: 0;
      width: 38px;
      height: 38px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .lesson-btn.active { color: #fff; }
    .starter .lesson-btn.active { background: var(--starter); border-color: var(--starter); }
    .elem1 .lesson-btn.active { background: var(--elem1); border-color: var(--elem1); }
    .elem2 .lesson-btn.active { background: var(--elem2); border-color: var(--elem2); }

    .list {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px calc(100px + env(safe-area-inset-bottom));
      -webkit-overflow-scrolling: touch;
    }

    .heading {
      margin: 12px 0 6px;
      padding: 9px 12px;
      border-radius: 8px;
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .heading.h1 {
      font-size: 0.98rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .heading.h2 {
      font-size: 0.88rem;
      font-weight: 600;
    }
    .heading-text { flex: 1; }
    .heading .color-dot {
      display: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.6);
      cursor: pointer;
      flex-shrink: 0;
    }
    body.edit-mode .heading .color-dot { display: block; }
    .heading .del-btn {
      display: none;
      background: rgba(0,0,0,0.3);
      color: #fff;
      border: none;
      border-radius: 6px;
      width: 28px;
      height: 28px;
      font-size: 0.9rem;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    body.edit-mode .heading .del-btn { display: flex; }

    .track {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 6px;
      background: var(--card);
    }
    .track-name {
      font-size: 0.88rem;
      margin-bottom: 6px;
      word-break: break-all;
      font-weight: 500;
    }
    audio {
      width: 100%;
      height: 34px;
      border-radius: 8px;
    }

    .insert-row {
      display: none;
      gap: 6px;
      margin: 4px 0 8px;
      justify-content: center;
    }
    body.edit-mode .insert-row { display: flex; }
    .insert-btn {
      flex: 1;
      padding: 7px 4px;
      border-radius: 8px;
      border: 1px dashed var(--border);
      background: transparent;
      color: var(--muted);
      font-size: 0.74rem;
      font-weight: 600;
      cursor: pointer;
    }
    .insert-btn:active { background: var(--card); }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 40px 20px;
      font-size: 0.9rem;
    }

    .settings-bar {
      display: none;
      gap: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    body.edit-mode .settings-bar { display: flex; }
    .settings-bar button {
      flex: 1;
      min-width: 90px;
      padding: 8px 6px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }
    .settings-bar button:active { opacity: 0.8; }
    .settings-bar .btn-export { border-color: #3b82f6; color: #93c5fd; }
    .settings-bar .btn-import { border-color: #10b981; color: #6ee7b7; }
    .settings-bar .btn-reset { border-color: var(--danger); color: #fca5a5; }

    .modal-bg {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-bg.show { display: flex; }
    .modal {
      background: var(--card);
      border-radius: 16px 16px 0 0;
      width: 100%;
      max-width: 500px;
      padding: 20px 16px 30px;
      border-top: 1px solid var(--border);
      max-height: 85vh;
      overflow-y: auto;
    }
    .modal h3 { font-size: 1rem; margin-bottom: 12px; }
    .modal label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .modal select, .modal input, .modal textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.95rem;
      margin-bottom: 12px;
      font-family: inherit;
    }
    .modal textarea {
      min-height: 120px;
      font-size: 0.8rem;
      resize: vertical;
    }
    .modal-actions { display: flex; gap: 8px; }
    .modal-actions button {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: none;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .btn-cancel { background: var(--border); color: var(--text); }
    .btn-ok { background: #3b82f6; color: #fff; }
    .btn-ok.green { background: #10b981; }

    .color-swatches {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }
    .swatch {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      border: 2px solid transparent;
      cursor: pointer;
    }
    .swatch.selected {
      border-color: #fff;
      box-shadow: 0 0 0 2px #3b82f6;
    }
    .custom-color-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 14px;
    }
    .custom-color-row input[type="color"] {
      width: 52px;
      height: 42px;
      padding: 2px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      cursor: pointer;
      flex-shrink: 0;
    }
    .custom-color-row .preview {
      flex: 1;
      height: 42px;
      border-radius: 10px;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 600;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>
  <header>
    <div class="top-row">
      <h1>IRODORI 123 LP2SSC</h1>
      <button class="btn-settings" id="btnSettings" onclick="toggleEdit()">⚙ Pengaturan</button>
    </div>
    <p class="subtitle" id="modeLabel">Mode: Ngajar (baca saja)</p>
    <div class="tabs">
      <button class="tab starter active" onclick="setLevel('starter')">Starter</button>
      <button class="tab elem1" onclick="setLevel('elem1')">Elem 1</button>
      <button class="tab elem2" onclick="setLevel('elem2')">Elem 2</button>
    </div>
    <div id="lessons" class="lessons-wrap starter"></div>

    <div class="settings-bar">
      <button class="btn-export" onclick="exportJSON()">⬆ Export</button>
      <button class="btn-import" onclick="openImport()">⬇ Import</button>
      <button class="btn-reset" onclick="resetCurrent()">🗑 Reset</button>
    </div>
  </header>

  <div class="list" id="list">
    <div class="empty">Memuat...</div>
  </div>

  <!-- Modal Heading -->
  <div class="modal-bg" id="modal">
    <div class="modal">
      <h3>Tambah Judul</h3>
      <label>Tipe</label>
      <select id="hType">
        <option value="h1">Heading 1 (besar)</option>
        <option value="h2">Heading 2 (kecil)</option>
      </select>
      <label>Teks judul</label>
      <input type="text" id="hText" placeholder="Contoh: Bagian Kiku / Hanasu..." />
      <label>Warna section</label>
      <div class="color-swatches" id="headingSwatches"></div>
      <div class="custom-color-row">
        <input type="color" id="hColorCustom" value="#334155" oninput="onCustomColor('heading')" />
        <div class="preview" id="hColorPreview">Custom</div>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">Batal</button>
        <button class="btn-ok" onclick="confirmHeading()">Simpan</button>
      </div>
    </div>
  </div>

  <!-- Modal warna section -->
  <div class="modal-bg" id="modalSectionColor">
    <div class="modal">
      <h3>Warna Section</h3>
      <p style="font-size:0.82rem;color:var(--muted);margin-bottom:10px;" id="sectionColorLabel"></p>
      <label>Pilih template</label>
      <div class="color-swatches" id="sectionSwatches"></div>
      <label>Atau custom sendiri</label>
      <div class="custom-color-row">
        <input type="color" id="sectionColorCustom" value="#334155" oninput="onCustomColor('section')" />
        <div class="preview" id="sectionColorPreview">Custom</div>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeSectionColor()">Batal</button>
        <button class="btn-ok" onclick="saveSectionColor()">Simpan</button>
      </div>
    </div>
  </div>

  <!-- Modal Import -->
  <div class="modal-bg" id="modalImport">
    <div class="modal">
      <h3>Import JSON</h3>
      <label>Tempel isi file JSON di sini</label>
      <textarea id="importText" placeholder='{"starter_01": [...], ...}'></textarea>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeImport()">Batal</button>
        <button class="btn-ok green" onclick="doImport()">Import</button>
      </div>
    </div>
  </div>

    const levels = {
      starter: { start: 1, end: 18 },
      elem1: { start: 1, end: 18 },
      elem2: { start: 1, end: 18 }
    };

    // ---- SECTION CONFIG ----
    const SECTION_CONFIG = {
      kyoshitsu: { label: 'KYOSHITSU', color: '#dc2626' },
      kiku:      { label: 'KIKU',      color: '#2563eb' },
      hanasu:    { label: 'HANASU',    color: '#16a34a' },
      katachi:   { label: 'KATACHI',   color: '#ca8a04' },
      kotoba:    { label: 'KOTOBA',    color: '#ea580c' },
      kaiwa:     { label: 'KAIWA',     color: '#7c3aed' },
      hiragana:  { label: 'HIRAGANA',  color: '#b45309' },
      katakana:  { label: 'KATAKANA',  color: '#64748b' },
      yomu:      { label: 'YOMU',      color: '#be185d' },
      other:     { label: 'LAINNYA',   color: '#475569' }
    };

    const SWATCHES = [
      '#1a2332','#334155','#475569','#b91c1c','#dc2626','#ea580c',
      '#ca8a04','#16a34a','#0d9488','#0284c7','#2563eb','#7c3aed',
      '#c026d3','#db2777','#ffffff','#e2e8f0'
    ];

    let currentLevel = 'starter';
    let currentLesson = 1;
    let editMode = false;
    let insertIndex = 0;
    let editingHeadingIndex = -1;
    let selectedHeadingColor = '#334155';

    // ---------- Helpers ----------

    function pad(n) { return n < 10 ? '0' + n : '' + n; }

    function extractRaw(filename) {
      if (!filename) return '';
      const m = filename.match(/_([a-zA-Z0-9_\- ]+)\.mp3$/i);
      return m ? m[1].trim() : filename.replace(/\.mp3$/i, '');
    }

    function extractSection(raw) {
      const m = raw.match(/^([a-z]+)/i);
      return m ? m[1].toLowerCase() : 'other';
    }

    function prettyName(raw) {
      let s = raw.replace(/_/g, ' ');
      s = s.replace(/([a-zA-Z])(\d)/g, '$1 $2');
      s = s.replace(/\b[a-z]/g, c => c.toUpperCase());
      return s;
    }

    function darken(hex, amount) {
      const r = parseInt(hex.slice(1,3), 16);
      const g = parseInt(hex.slice(3,5), 16);
      const b = parseInt(hex.slice(5,7), 16);
      const nr = Math.round(r * (1 - amount));
      const ng = Math.round(g * (1 - amount));
      const nb = Math.round(b * (1 - amount));
      return '#' + [nr, ng, nb].map(x => x.toString(16).padStart(2, '0')).join('');
    }

    // ---------- Storage ----------

    function storageKey(level, lesson) {
      return 'irodori_custom_' + level + '_' + pad(lesson);
    }

    function loadCustom(level, lesson) {
      try {
        const raw = localStorage.getItem(storageKey(level, lesson));
        return raw ? JSON.parse(raw) : null;
      } catch(e) { return null; }
    }

    function saveCustom(level, lesson, items) {
      localStorage.setItem(storageKey(level, lesson), JSON.stringify(items));
    }

    function isLight(hex) {
      if (!hex || hex.length < 7) return false;
      const r = parseInt(hex.slice(1,3), 16);
      const g = parseInt(hex.slice(3,5), 16);
      const b = parseInt(hex.slice(5,7), 16);
      return (r*0.299 + g*0.587 + b*0.114) > 160;
    }

    // ---------- Build display items (auto-section) ----------

    function buildDisplayItems() {
      const key = currentLevel + '_' + pad(currentLesson);
      const tracks = AUDIO_DATA[key] || [];
      const saved = loadCustom(currentLevel, currentLesson);
      if (saved && Array.isArray(saved)) return saved;
      if (!tracks.length) return [];

      // Pre-scan: hitung berapa blok tiap section
      const blockCount = {};
      let prev = null;
      tracks.forEach(t => {
        const s = extractSection(extractRaw(t.name));
        if (s !== prev) blockCount[s] = (blockCount[s] || 0) + 1;
        prev = s;
      });

      const items = [];
      let currentSection = null;
      const blockNum = {};
      const itemNum = {};

      tracks.forEach(t => {
        const raw = extractRaw(t.name);
        const section = extractSection(raw);
        const conf = SECTION_CONFIG[section] || SECTION_CONFIG.other;

        // Section baru → tambah H1 header
        if (section !== currentSection) {
          blockNum[section] = (blockNum[section] || 0) + 1;
          const n = blockNum[section];
          const label = blockCount[section] > 1 ? conf.label + ' ' + n : conf.label;
          items.push({ type: 'h1', text: label, color: conf.color });
          currentSection = section;
          itemNum[section] = 0;
        }

        const idx = itemNum[section]++;
        const bgColor = (idx % 2 === 0) ? conf.color : darken(conf.color, 0.5);

        items.push({
  type: 'track',
  url: t.url,
  name: t.name, // <--- Ubah jadi t.name
  color: bgColor
});
      });

      return items;
    }

    function getItems() { return buildDisplayItems(); }

    // ---------- Render ----------

    function renderLessons() {
      const conf = levels[currentLevel];
      const wrap = document.getElementById('lessons');
      wrap.className = 'lessons-wrap ' + currentLevel;
      wrap.innerHTML = '';
      for (let i = conf.start; i <= conf.end; i++) {
        const btn = document.createElement('button');
        btn.className = 'lesson-btn' + (i === currentLesson ? ' active' : '');
        btn.textContent = i;
        btn.onclick = () => selectLesson(i);
        wrap.appendChild(btn);
      }
    }

    function selectLesson(num) {
      currentLesson = num;
      renderLessons();
      renderList();
    }

    function setLevel(level) {
      currentLevel = level;
      currentLesson = levels[level].start;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelector('.tab.' + level).classList.add('active');
      renderLessons();
      renderList();
    }

    function toggleEdit() {
      editMode = !editMode;
      document.body.classList.toggle('edit-mode', editMode);
      const btn = document.getElementById('btnSettings');
      const label = document.getElementById('modeLabel');
      if (editMode) {
        btn.classList.add('edit');
        btn.textContent = '✓ Selesai';
        label.textContent = 'Mode: Pengaturan (bisa tambah judul + warna)';
      } else {
        btn.classList.remove('edit');
        btn.textContent = '⚙ Pengaturan';
        label.textContent = 'Mode: Ngajar (baca saja)';
      }
      renderList();
    }

    function buildSwatches(containerId, selected, onSelect) {
      const el = document.getElementById(containerId);
      el.innerHTML = '';
      SWATCHES.forEach(c => {
        const s = document.createElement('div');
        s.className = 'swatch' + (c.toLowerCase() === (selected||'').toLowerCase() ? ' selected' : '');
        s.style.background = c;
        if (c === '#ffffff' || c === '#e2e8f0') s.style.border = '1px solid #94a3b8';
        s.onclick = () => onSelect(c);
        el.appendChild(s);
      });
    }

    function updatePreview(which, color) {
      const preview = document.getElementById(which === 'heading' ? 'hColorPreview' : 'sectionColorPreview');
      const input = document.getElementById(which === 'heading' ? 'hColorCustom' : 'sectionColorCustom');
      preview.style.background = color;
      preview.style.color = isLight(color) ? '#111' : '#fff';
      input.value = color;
    }

    function onCustomColor(which) {
      const input = document.getElementById(which === 'heading' ? 'hColorCustom' : 'sectionColorCustom');
      selectedHeadingColor = input.value;
      updatePreview(which, selectedHeadingColor);
      const container = which === 'heading' ? 'headingSwatches' : 'sectionSwatches';
      buildSwatches(container, null, function(c) {
        selectedHeadingColor = c;
        updatePreview(which, c);
        buildSwatches(container, c, arguments.callee);
      });
    }

    function openModal(index) {
      insertIndex = index;
      selectedHeadingColor = '#334155';
      document.getElementById('hText').value = '';
      document.getElementById('hType').value = 'h1';
      updatePreview('heading', selectedHeadingColor);
      buildSwatches('headingSwatches', selectedHeadingColor, function(c) {
        selectedHeadingColor = c;
        updatePreview('heading', c);
        buildSwatches('headingSwatches', c, arguments.callee);
      });
      document.getElementById('modal').classList.add('show');
      setTimeout(() => document.getElementById('hText').focus(), 100);
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('show');
    }

    function confirmHeading() {
      const type = document.getElementById('hType').value;
      const text = document.getElementById('hText').value.trim();
      if (!text) { alert('Judul belum diisi'); return; }
      selectedHeadingColor = document.getElementById('hColorCustom').value || selectedHeadingColor;
      const items = getItems();
      items.splice(insertIndex, 0, { type, text, color: selectedHeadingColor });
      saveCustom(currentLevel, currentLesson, items);
      closeModal();
      renderList();
    }

    function deleteHeading(index) {
      if (!confirm('Hapus judul ini?')) return;
      const items = getItems();
      items.splice(index, 1);
      saveCustom(currentLevel, currentLesson, items);
      renderList();
    }

    function openSectionColor(index) {
      editingHeadingIndex = index;
      const items = getItems();
      const item = items[index];
      const color = item.color || '#334155';
      selectedHeadingColor = color;
      document.getElementById('sectionColorLabel').textContent = item.text || '';
      updatePreview('section', color);
      buildSwatches('sectionSwatches', color, function(c) {
        selectedHeadingColor = c;
        updatePreview('section', c);
        buildSwatches('sectionSwatches', c, arguments.callee);
      });
      document.getElementById('modalSectionColor').classList.add('show');
    }

    function closeSectionColor() {
      document.getElementById('modalSectionColor').classList.remove('show');
      editingHeadingIndex = -1;
    }

    function saveSectionColor() {
      const color = document.getElementById('sectionColorCustom').value || selectedHeadingColor;
      const items = getItems();
      if (editingHeadingIndex >= 0 && items[editingHeadingIndex]) {
        items[editingHeadingIndex].color = color;
        // Update tracks di bawah heading ini sampai heading berikutnya
        let altIdx = 0;
        for (let i = editingHeadingIndex + 1; i < items.length; i++) {
          if (items[i].type === 'h1' || items[i].type === 'h2') break;
          if (items[i].type === 'track') {
            items[i].color = (altIdx % 2 === 0) ? color : darken(color, 0.5);
            altIdx++;
          }
        }
        saveCustom(currentLevel, currentLesson, items);
      }
      closeSectionColor();
      renderList();
    }

    function renderList() {
      const items = buildDisplayItems();
      const list = document.getElementById('list');
      if (!items.length) {
        list.innerHTML = '<div class="empty">Tidak ada audio</div>';
        return;
      }

      let html = '';
      html += '<div class="insert-row"><button class="insert-btn" onclick="openModal(0)">+ Heading 1 / 2</button></div>';

      let currentColor = '#1a2332';

      items.forEach((item, i) => {
        if (item.type === 'h1' || item.type === 'h2') {
          currentColor = item.color || '#1a2332';
          const textColor = isLight(currentColor) ? '#111' : '#fff';
          const style = 'background:' + currentColor + ';color:' + textColor + ';border-left:4px solid rgba(0,0,0,0.35)';
          html += '<div class="heading ' + item.type + '" style="' + style + '">' +
            '<span class="heading-text">' + item.text + '</span>' +
            '<div class="color-dot" style="background:' + currentColor + '" onclick="openSectionColor(' + i + ')" title="Ubah warna"></div>' +
            '<button class="del-btn" onclick="deleteHeading(' + i + ')">✕</button></div>' +
            '<div class="insert-row"><button class="insert-btn" onclick="openModal(' + (i+1) + ')">+ Heading 1 / 2</button></div>';
        } else {
          const bgColor = item.color || currentColor;
          const nameColor = isLight(bgColor) ? '#111' : '#e7ecf3';
          const borderColor = darken(bgColor, 0.7);
          html += '<div class="track" style="background:' + bgColor + ';border-color:' + borderColor + '">' +
            '<div class="track-name" style="color:' + nameColor + '">' + item.name + '</div>' +
            '<audio controls preload="none" src="' + item.url + '"></audio></div>' +
            '<div class="insert-row"><button class="insert-btn" onclick="openModal(' + (i+1) + ')">+ Heading 1 / 2</button></div>';
        }
      });

      list.innerHTML = html;
    }

    // ---------- Export / Import ----------

    function exportJSON() {
      const all = {};
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith('irodori_custom_')) {
          try { all[k.replace('irodori_custom_', '')] = JSON.parse(localStorage.getItem(k)); }
          catch(e) {}
        }
      }
      if (Object.keys(all).length === 0) { alert('Belum ada pengaturan yang disimpan.'); return; }
      const blob = new Blob([JSON.stringify(all, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'irodori-settings.json';
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function openImport() {
      document.getElementById('importText').value = '';
      document.getElementById('modalImport').classList.add('show');
    }

    function closeImport() { document.getElementById('modalImport').classList.remove('show'); }

    function doImport() {
      const raw = document.getElementById('importText').value.trim();
      if (!raw) { alert('JSON kosong'); return; }
      let data;
      try { data = JSON.parse(raw); }
      catch(e) { alert('JSON tidak valid'); return; }
      if (typeof data !== 'object' || Array.isArray(data)) { alert('Format JSON salah'); return; }
      let count = 0;
      for (const key in data) {
        if (Array.isArray(data[key])) {
          localStorage.setItem('irodori_custom_' + key, JSON.stringify(data[key]));
          count++;
        }
      }
      closeImport();
      renderList();
      alert('Import berhasil: ' + count + ' lesson');
    }

    function resetCurrent() {
      if (!confirm('Reset lesson ini ke tampilan default (auto-section)?')) return;
      localStorage.removeItem(storageKey(currentLevel, currentLesson));
      renderList();
    }

    document.getElementById('modal').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });
    document.getElementById('modalImport').addEventListener('click', function(e) {
      if (e.target === this) closeImport();
    });
    document.getElementById('modalSectionColor').addEventListener('click', function(e) {
      if (e.target === this) closeSectionColor();
    });

    renderLessons();
    renderList();
  </script>
</body>
</html>
